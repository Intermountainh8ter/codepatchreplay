[package]
name = "codepatchreplay"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Pre-registered code-generation reproducibility: pin the target, template, sampling, and task→test map; score pass@k with 95% bootstrap CIs and flag patch-identity leaks against a reference set."
repository = "https://github.com/Intermountainh8ter/codepatchreplay"
keywords = ["llm", "code-generation", "humaneval", "mbpp", "reproducibility"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
rand = "0.8"
rand_pcg = "0.3"

[[bin]]
name = "codepatchreplay"
path = "src/main.rs"

[lib]
name = "codepatchreplay"
path = "src/lib.rs"
